# ==============================================================================
# router_config.yaml · 高性价比人生指南 路由与检索全景配置文件
# 适用范围: 知识包导入编译管线 (backend/pipeline) 与 Web 客户端检索器 (frontend/web)
# 架构层级: L0 闸门 -> L1 域 (12个) -> L2 情境 -> L3 条目 + 正交标签
# ==============================================================================

version: "2026.1"
schema_version: "1.0.0"

# ------------------------------------------------------------------------------
# L0 闸门: 危机拦截、现场急救与意图识别
# ------------------------------------------------------------------------------
gatekeeper:
  # 1. 危机通道 (Crisis): 绝对零检索，静态卡片直接拦截，提供法定救助热线与安全兜底
  crisis:
    enabled: true
    template: "crisis_static_card"
    triggers:
      - "自杀"
      - "自残"
      - "想死"
      - "不想活了"
      - "跳楼"
      - "割腕"
      - "家暴"
      - "被打了"
      - "非法拘禁"
      - "人身伤害"
      - "被绑架"
      - "被强奸"
      - "强迫卖淫"
    hotlines:
      - name: "全国统一急救电话"
        number: "120"
        desc: "生命危急、重度外伤、意识不清时即刻拨打"
      - name: "全国统一报警电话"
        number: "110"
        desc: "人身自由受侵害、恶性暴力、现行违法犯罪即刻报警"
      - name: "全国心理危机干预热线"
        number: "12356"
        desc: "卫生健康委心理援助热线（免费、保密）"
      - name: "全国法律援助热线"
        number: "12348"
        desc: "司法行政部门免费法律咨询与法援申请指引"
      - name: "全国妇女维权热线"
        number: "12338"
        desc: "家庭暴力紧急求助与庇护申请"
      - name: "全国反电信网络诈骗专用号码"
        number: "96110"
        desc: "遭遇电信网络诈骗、紧急止付预警"

  # 2. E0 现场急救通道 (Emergency Rescue): ≤ 3条，仅输出「标题 + 说人话」，去除冗余
  e0_rescue:
    enabled: true
    max_items: 3
    template: "rescue_card"
    suppress_fields: ["cost", "evidence", "sources", "notes", "tags"]
    display_fields: ["title", "plain"]
    triggers:
      - "倒地"
      - "心跳骤停"
      - "没呼吸"
      - "心脏骤停"
      - "不省人事"
      - "气道异物"
      - "吃东西卡住"
      - "噎住"
      - "海姆立克"
      - "大出血"
      - "动脉出血"
      - "止血"
      - "胸痛"
      - "心肌梗死"
      - "嘴歪"
      - "脑卒中"
      - "中风"
      - "触电"
      - "溺水"
      - "严重烧伤"
      - "过敏性休克"

  # 3. 意图分类器 (Intent Classifier)
  intent_classification:
    default_intent: "instant"
    intents:
      instant:
        name: "现场处置"
        desc: "当前正发生、需立即采取物理动作或止损指令"
        keywords: ["怎么办", "现在", "立刻", "立刻做", "当场", "紧急", "正在", "现场", "出现", "突然", "抢救", "第一步"]
      remedy:
        name: "事后应对与维权"
        desc: "事件已发生，需取证、索赔、报案、诉讼、补缴、救济"
        keywords: ["事后", "被骗了", "被裁了", "被欠薪", "被辞退", "扣押金", "赔偿", "维权", "仲裁", "报案", "报警流程", "起诉", "工伤认定", "补办", "继承"]
      prevent:
        name: "预防常备与决策"
        desc: "事前防范、常备物资、习惯建立、红线防坑、签约防范"
        keywords: ["怎么预防", "如何预防", "常备", "清单", "签约注意", "买前", "体检", "接种", "避坑", "防范", "准备", "平时"]

# ------------------------------------------------------------------------------
# L1 域 (Domain Mapping): 12 个生命大域，全书 34 节严格归属
# ------------------------------------------------------------------------------
domains:
  - id: "emergency"
    name: "急救与突发险情"
    desc: "现场急救、突发危急重症、自然灾害脱险与极端意外自救"
    chapters: [13]
    default_urgency: "E0"
    priority: 100

  - id: "safety"
    name: "身体安全与意外防范"
    desc: "交通安全、高坠防护、中毒用气、常备药禁忌与防灾装备"
    chapters: [1, 34]
    default_urgency: "E1"
    priority: 90

  - id: "healthcare"
    name: "医疗就医与慢病管理"
    desc: "科学就医门诊、慢病科学自控、循证用药与有效筛查"
    chapters: [2, 16, 24, 28]
    default_urgency: "E2"
    priority: 85

  - id: "psychology"
    name: "心理健康与精力管理"
    desc: "情绪降噪、心理创伤急救、重大打击韧性与精力止损"
    chapters: [3, 22, 29]
    default_urgency: "E2"
    priority: 80

  - id: "finance"
    name: "财务自保与兜底保障"
    desc: "防止大额消费陷阱、穷困时法定社会救助、医保低保与保险精选"
    chapters: [5, 7]
    default_urgency: "E1"
    priority: 85

  - id: "legal"
    name: "法律自保与红线防范"
    desc: "刑事民事底线自保、取证要点、避免触犯红线与被骗应对"
    chapters: [8, 9]
    default_urgency: "E1"
    priority: 88

  - id: "career"
    name: "职场劳动与工伤维权"
    desc: "劳动合同防坑、加班费取证、非法裁员维权与工伤法定赔偿"
    chapters: [4, 19]
    default_urgency: "E1"
    priority: 82

  - id: "housing"
    name: "租房安居与房产交易"
    desc: "租房避坑、入住交接留证、押金全额退还维权与买房红线"
    chapters: [15]
    default_urgency: "E1"
    priority: 78

  - id: "family"
    name: "婚恋育儿与生育呵护"
    desc: "婚姻财产边界、科学备孕生产、新生儿护理与育儿开支止损"
    chapters: [10, 18, 20, 27]
    default_urgency: "E2"
    priority: 75

  - id: "elderly_care"
    name: "代际照护与身后事办理"
    desc: "老年跌倒防范、慢病陪诊、学龄教育决策与法定身后事办理流程"
    chapters: [17, 25, 30]
    default_urgency: "E2"
    priority: 76

  - id: "growth"
    name: "升学成长与跨国安全"
    desc: "高考升学少走弯路、高性价比技能自学、留学与出国境外安全"
    chapters: [21, 23, 31, 32]
    default_urgency: "E2"
    priority: 70

  - id: "digital_biz"
    name: "数字安全与创业经营"
    desc: "个人隐私账号防护、技术人法律红线、小微生意避坑与反面清单"
    chapters: [6, 11, 12, 14, 26, 33]
    default_urgency: "E2"
    priority: 72

# ------------------------------------------------------------------------------
# L2 情境 (Scenario Library): 典型高频生活处境与触发问法 (最多召回 3 个)
# ------------------------------------------------------------------------------
scenarios:
  # 1. 紧急重症类
  - id: "cardiac_arrest"
    domain: "emergency"
    name: "倒地无呼吸 / 心跳骤停"
    triggers: ["倒地", "无呼吸", "没呼吸", "猝死", "按压胸口", "AED", "心肺复苏", "CPR"]
    sample_queries:
      - "有人突然倒在地上没有呼吸了怎么办"
      - "怎么做心肺复苏和找AED"
      - "家里老人突然晕倒没反应"
    default_urgency: "E0"
    default_intent: "instant"
    phase_mapping:
      instant: "PT0M"
      remedy: "PT24H"
      prevent: "P30D"

  - id: "stroke"
    domain: "emergency"
    name: "急性脑卒中 / 中风"
    triggers: ["嘴歪", "胳膊没劲", "说话不清", "中风", "脑卒中", "脑梗", "眼发黑", "站不稳"]
    sample_queries:
      - "老人突然嘴歪胳膊抬不起来"
      - "中风急救打120"
      - "单眼突然发黑是脑梗吗"
    default_urgency: "E0"
    default_intent: "instant"

  - id: "airway_obstruction"
    domain: "emergency"
    name: "异物卡喉 / 气道梗阻"
    triggers: ["卡喉", "噎住", "喘不上气", "海姆立克", "吃东西卡牢", "异物梗阻"]
    sample_queries:
      - "吃东西噎住了喘不上气怎么办"
      - "婴儿异物卡喉急救方法"
      - "海姆立克急救法怎么操作"
    default_urgency: "E0"
    default_intent: "instant"

  - id: "heatstroke"
    domain: "emergency"
    name: "中暑与热射病"
    triggers: ["中暑", "热射病", "高温晕厥", "高温脱水", "头晕出汗不退"]
    sample_queries:
      - "大热天户外头晕恶心发烧是中暑吗"
      - "中暑怎么快速降温"
      - "夏天户外怎么预防热射病"
    default_urgency: "E0"
    default_intent: "instant"
    phase_mapping:
      instant: "PT1H"
      remedy: "PT24H"
      prevent: "P7D"

  # 2. 职场权益类
  - id: "laid_off"
    domain: "career"
    name: "被公司裁员 / 辞退"
    triggers: ["裁员", "辞退", "被开除", "劝退", "主动辞职", "N+1", "2N", "赔偿金", "HR谈话", "签字"]
    sample_queries:
      - "HR突然叫我谈离职让我签字怎么办"
      - "被裁员怎么拿满N+1补偿金"
      - "离职后怎么办理失业金"
    default_urgency: "E1"
    default_intent: "instant"
    phase_mapping:
      instant: "PT1H"
      remedy: "P7D"
      prevent: "P30D"

  - id: "owed_wages"
    domain: "career"
    name: "公司拖欠工资 / 欠薪"
    triggers: ["欠薪", "拖欠工资", "不发工资", "克扣工资", "包工头跑路", "小作坊欠钱", "12333"]
    sample_queries:
      - "老板欠了两个月工资不发怎么维权"
      - "没签劳动合同怎么证明劳动关系要工资"
      - "劳动监察大队投诉欠薪流程"
    default_urgency: "E1"
    default_intent: "instant"

  # 3. 租房与财务维权类
  - id: "rent_deposit"
    domain: "housing"
    name: "退租押金被扣 / 租房纠纷"
    triggers: ["退租", "扣押金", "不退押金", "交接单", "房东赖账", "定金陷阱", "租房签合同"]
    sample_queries:
      - "退房时房东以各种理由扣押金怎么办"
      - "租房入住时怎么录像取证防赖账"
      - "房东不退押金起诉管用吗"
    default_urgency: "E1"
    default_intent: "instant"

  - id: "scam_loss"
    domain: "legal"
    name: "遭遇电信网络诈骗"
    triggers: ["被骗了", "刷单被骗", "杀猪盘", "转账被骗", "止付", "银行卡冻结", "网购退款骗局"]
    sample_queries:
      - "刚把钱转给骗子了怎么立刻止付"
      - "被网上刷单骗了钱报警有用吗"
      - "遭遇电信诈骗黄金半小时该做什么"
    default_urgency: "E1"
    default_intent: "instant"

  # 4. 家庭与医疗类
  - id: "chronic_diagnosed"
    domain: "healthcare"
    name: "确诊慢性病 (高血压/糖尿病/痛风等)"
    triggers: ["确诊慢病", "高血压", "糖尿病", "尿酸高", "痛风", "慢病门诊报销", "特病报销"]
    sample_queries:
      - "体检查出糖尿病第一步该怎么做"
      - "高血压医保门诊慢病怎么申报"
      - "得了慢性病怎么避免买假药偏方"
    default_urgency: "E2"
    default_intent: "instant"

  - id: "bereavement"
    domain: "elderly_care"
    name: "家人离世 / 身后事办理"
    triggers: ["亲人离世", "老人去世", "开死亡证明", "销户", "丧葬补助", "遗产继承", "银行存款继承"]
    sample_queries:
      - "家里老人去世第一天该去哪里办手续"
      - "去世后社保丧葬费抚恤金怎么领"
      - "老人生前银行卡密码不知道怎么取钱"
    default_urgency: "E1"
    default_intent: "instant"

# ------------------------------------------------------------------------------
# L3 条目标签体系与判定依据 (Orthogonal Facets & Heuristics)
# ------------------------------------------------------------------------------
tagging_system:
  # 1. 紧急度 (Urgency)
  urgency:
    levels:
      E0:
        label: "即时生命抢救"
        timeframe: "0 - 15 分钟"
        criteria: "直接危及呼吸心跳、严重急性创伤、脑血管闭塞等致命致残终点"
        title_patterns: ["没呼吸", "倒地", "立刻打 120", "窒息", "按压胸口", "AED", "大出血", "休克", "卒中"]
      E1:
        label: "黄金时限维权与干预"
        timeframe: "1 小时 - 7 天"
        criteria: "法定证据灭失、诉讼或申领时效限制、资金冻结黄金窗口、暴露后药物阻断"
        title_patterns: ["笔递过来", "录音", "止付", "PEP", "工伤认定", "留存证据", "不要签", "交接单"]
      E2:
        label: "常规循证与预防决策"
        timeframe: "数天 - 终身"
        criteria: "微习惯、预防性接种与体检、商业决策、长周期技能提升与养老储备"
        title_patterns: [".*"]

  # 2. 意图轴 (Intent)
  intent:
    instant:
      filter_phase: ["PT0M", "PT1H"]
      weight_boost: 2.5
    remedy:
      filter_phase: ["PT24H", "P7D", "P30D"]
      weight_boost: 2.2
    prevent:
      filter_phase: ["PREVENT", "ROUTINE", "BASELINE"]
      weight_boost: 2.0

  # 3. 标题切分规则 (Title Syntax Grammar)
  title_grammar:
    delimiter_regex: "[，；,;]"
    structure:
      scenario_part: "第一个分隔符前的短语，代表用户现场与触发病理/困境"
      action_part: "第一个分隔符后的短语，代表权威指导的具体处置动作"
    fallback_as_full_title: false

  # 4. 排序先验配置 (Chapter Prior Weights)
  ranking_priors:
    # 第 13 节特殊规则: 序号越小，致死致残严重度与抢救优先级越高 (序号即先验)
    chapter_13_inverse_index_weight: true
    chapter_13_base_score: 1000
    chapter_13_decay_factor: 15
    # 其它常规章节按公式: (证据权重 * 收益系数) / (综合成本 + 1)
    standard_formula:
      evidence_weights:
        A: 3.0
        B: 2.0
        C: 1.0
      benefit_weights:
        "大": 3.0
        "中": 2.0
        "小": 1.0
      caliber_priorities:
        "死亡率": 4.0
        "自由": 3.2
        "金钱": 2.5
        "时间": 1.8
      cost_weights:
        money: { "0": 0.0, "少": 1.0, "多": 3.0 }
        time: { "少": 0.5, "中": 1.5, "多": 3.0 }
        willpower: { "否": 0.0, "些": 1.0, "是": 2.5 }

  # 5. 受益人分档与权重惩罚/自保标记
  beneficiary:
    grades:
      - tier: 1
        name: "自己"
        liability_risk: "低"
      - tier: 2
        name: "配偶与直系亲属"
        liability_risk: "低"
      - tier: 3
        name: "朋友、同事及熟人"
        liability_risk: "中"
      - tier: 4
        name: "陌生人"
        liability_risk: "高 (必须包含免责自保提示，如下手扶人/拉架防讹防伤风险)"

  # 6. 证据与争议标记
  audit_status:
    disputed_tag: "争议"
    unverified_tag: "待核实"

# ------------------------------------------------------------------------------
# 组装输出模板 (Answer Assembly Layouts)
# ------------------------------------------------------------------------------
assembly_templates:
  crisis_static_card:
    layout: "alert_dialog"
    primary_color: "coral_red"
    show_hotlines: true
    allow_search_refinement: false

  rescue_card:
    layout: "minimal_steps"
    max_items: 3
    show_plain_only: true
    emphasize_first_step: true
    banner: "⚠️ 黄金抢救现场 · 立即执行以下动作，切勿浪费时间"

  timeline_playbook:
    layout: "chronological_stepper"
    time_nodes:
      - phase: "PT1H"
        title: "此时此刻 (现场与第 1 小时)"
        badge: "不可逆红线"
      - phase: "PT24H"
        title: "24 小时内 (取证与保全)"
        badge: "法定证据链"
      - phase: "P7D"
        title: "7 天内 (行政报案与窗口期)"
        badge: "救济程序"
      - phase: "P30D"
        title: "30 天至仲裁/起诉"
        badge: "实体维权"

  evidence_checklist:
    layout: "editorial_cards"
    show_badges: true
    show_cost_breakdown: true
    show_neighbor_links: true
    show_dispute_notice: true
